name: Apply taxi form layout repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  BASE_SHA: 2b0a219aa2b7e071dc97a7a377881bbe34a55e60
  VALIDATED_BRANCH: agent/taxi-form-layout-fix-validated

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reconstruct reviewed taxi form repair
        run: |
          cp .taxi-form-layout.patch /tmp/taxi-form-layout.patch
          git checkout --detach "$BASE_SHA"
          git apply --check /tmp/taxi-form-layout.patch
          git apply /tmp/taxi-form-layout.patch
          git diff --check

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build and browser dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Build strict TypeScript website
        run: npm run build

      - name: Run mobile interface regressions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/hostel4pets-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/test-interface.mjs http://127.0.0.1:4173

      - name: Publish one clean validated commit
        run: |
          git config user.name "Kitty Crow"
          git config user.email "kitty-crow@users.noreply.github.com"
          git add index.html scripts/test-interface.mjs styles/forms.css styles/taxi.css
          git commit -m "Refine pet taxi form structure"
          git push origin "HEAD:refs/heads/$VALIDATED_BRANCH" --force
