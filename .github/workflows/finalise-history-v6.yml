name: Finalise audited history v6

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  finalise:
    if: github.head_ref == 'history-fixing'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 6d09f3676596c74b494832631f4a0922cea95f48
      FINAL_TREE: 0230d7be63626176d62e8d4849b8fe7f6e34e81e
      FINAL_SHA: 07ba1edeb8f6a75b7f091c9a511a9b3ba5398e18
      RELEASE_TAG: v1.0.0
      AUTHOR_NAME: Kitty Crow
      AUTHOR_EMAIL: 141717449+kitty-crow@users.noreply.github.com
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: history-fixing
          show-progress: false

      - name: Decode and build with pinned TypeScript
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .history-rewrite/release.part-* | base64 --decode | gzip --decompress > /tmp/release.patch
          cat .history-rewrite/styles.part-* | base64 --decode | gzip --decompress > /tmp/styles.patch
          git apply /tmp/release.patch
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund --silent
          test "$(node_modules/.bin/tsc --version)" = 'Version 7.0.2'
          npm run build --silent
          rm -rf generated
          cp -a dist/generated generated
          diff -qr generated dist/generated
          test "$(cat VERSION)" = 1.0.0
          test -f dist/styles/styles.css
          test -f dist/styles/calendar.css
          test -f dist/styles/chat.css
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          for path in / /styles/styles.css /styles/calendar.css /styles/chat.css /generated/bookingCalculator.js /generated/calendar.js /generated/main.js; do
            curl --fail --silent "http://127.0.0.1:4173${path}" >/dev/null
          done

      - name: Prepare exact clean release trees
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/css-stage /tmp/final-stage
          git worktree add --quiet --detach /tmp/css-stage d365395964fd1f46d4438de336a41e2516738cb6
          git -C /tmp/css-stage apply /tmp/styles.patch
          git -C /tmp/css-stage add -A
          test "$(git -C /tmp/css-stage write-tree)" = 001b3ed72585612af20e1db4cc8e2fae8cd8d8c2

          git worktree add --quiet --detach /tmp/final-stage "$BASE_SHA"
          git -C /tmp/final-stage apply /tmp/release.patch
          rm -rf /tmp/final-stage/generated
          cp -a generated /tmp/final-stage/generated
          git -C /tmp/final-stage add -A
          test "$(git -C /tmp/final-stage write-tree)" = "$FINAL_TREE"

      - name: Construct deterministic six-commit history
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          css_tree=$(git -C /tmp/css-stage write-tree)
          final_tree=$(git -C /tmp/final-stage write-tree)
          export GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"
          export GIT_COMMITTER_NAME="$AUTHOR_NAME" GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL"
          commit_root() { GIT_AUTHOR_DATE="$2" GIT_COMMITTER_DATE="$2" git commit-tree "$1" <<<"$3"; }
          commit_child() { GIT_AUTHOR_DATE="$3" GIT_COMMITTER_DATE="$3" git commit-tree "$1" -p "$2" <<<"$4"; }

          m1=$'Create booking calculator website\n\nAdd the initial static booking form, price and deposit calculation, branding,\nresponsive base styles and custom domain configuration.'
          m2=$'Add availability calendar and booking details\n\nAdd monthly availability, booking markers, selected date ranges and the daily\npet detail view.'
          m3=$'Add guest chat and notification controls\n\nAdd the guest chat panel, message presentation, notification sound, mute and\nclear controls, typing feedback and staff hand-off notices. Organise image and\nsound assets under dedicated directories.'
          m4=$'Add pet taxi and service integrations\n\nAdd pet taxi coverage and price requests, then consolidate calendar, chat and\ntaxi service calls on the Hostel4Pets API hosted at h4p.kittycrow.dev.'
          m5=$'Modularise and modernise website styles\n\nMove styling into feature modules under styles/ and assemble them through a\nlayered styles.css entry point. Adopt native nesting, logical properties,\nresponsive range queries and reduced-motion handling without changing the\nsite public behaviour.'
          m6=$'Migrate frontend to strict TypeScript and release v1.0.0\n\nReplace hand-written browser JavaScript with strict TypeScript source and\ntracked generated ES modules. Add source, stylesheet and release validation,\nrepair branch-based Pages deployment, verify published assets, remove inline\ncode and document the production build and project structure.'

          c1=$(commit_root "$(git rev-parse b25e258^{tree})" '2025-01-26T12:20:18Z' "$m1")
          c2=$(commit_child "$(git rev-parse 7fe5f69^{tree})" "$c1" '2025-09-27T20:46:29+01:00' "$m2")
          c3=$(commit_child "$(git rev-parse c82cbb0^{tree})" "$c2" '2025-11-12T14:07:58Z' "$m3")
          c4=$(commit_child "$(git rev-parse d365395^{tree})" "$c3" '2026-05-21T15:09:36+01:00' "$m4")
          c5=$(commit_child "$css_tree" "$c4" '2026-07-27T09:28:18+01:00' "$m5")
          c6=$(commit_child "$final_tree" "$c5" '2026-07-27T09:42:00+01:00' "$m6")
          test "$c6" = "$FINAL_SHA"
          test "$(git rev-list --count "$c6")" = 6
          git update-ref refs/heads/rewritten-main "$c6"
          GIT_COMMITTER_DATE='2026-07-27T09:42:00+01:00' git tag -f -a "$RELEASE_TAG" "$c6" -m 'Hostel4Pets website v1.0.0'

      - name: Publish rewritten branch and v1.0.0 tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin refs/heads/rewritten-main:refs/heads/history-fixing
          git push --force origin "refs/tags/${RELEASE_TAG}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=success -f context='history/objects-validated' \
            -f description='Six TypeScript 7 release commits and v1.0.0 tag published' >/dev/null

      - name: Remove every non-main branch
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          for branch in "${branches[@]}"; do [[ "$branch" == main ]] || git push origin --delete "$branch"; done
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_SHA}" \
            -f state=success -f context='history/rewrite-validation' \
            -f description='Six-commit v1.0.0 history validated and branches cleaned' >/dev/null
