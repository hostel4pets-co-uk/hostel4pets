name: Build and deploy website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Compile strict TypeScript
        run: npm run build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always() && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report deployment status
        uses: actions/github-script@v8
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const succeeded = process.env.BUILD_RESULT === 'success'
              && process.env.DEPLOY_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'pages/typescript-deployment',
              description: succeeded
                ? 'TypeScript build and Pages deployment succeeded'
                : 'TypeScript build or Pages deployment failed'
            });
            if (!succeeded) {
              core.setFailed('TypeScript build or Pages deployment failed');
            }
