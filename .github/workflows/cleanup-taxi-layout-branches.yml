name: Clean up taxi layout branches

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary taxi layout branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/taxi-form-layout-fix-validated"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/agent/taxi-form-layout-fix-staging"
