<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#363cb8">
  <title>Guest Chat | Hostel4Pets</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    .chat-page__main {
      padding-block: clamp(1rem, 2.5vw, 1.75rem) clamp(0.75rem, 1.8vw, 1.25rem);
    }

    .chat-page__intro h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1;
      white-space: nowrap;
    }

    @media (width <= 32rem) {
      .chat-page__intro h1 {
        font-size: clamp(1.65rem, 8vw, 2.25rem);
      }
    }
  </style>
  <script type="module" src="/generated/routes.js"></script>
  <script type="module" src="/generated/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mobile-detect@1.4.5/mobile-detect.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script type="module" src="/generated/interface.js"></script>
</head>

<body class="site-page inner-page chat-page">
  <header class="site-header standalone-only">
    <div class="site-header__inner">
      <a class="site-brand" href="/" aria-label="Hostel4Pets home"><img src="/graphics/h4p.png" alt="Hostel4Pets" class="site-brand__logo"></a>
      <nav class="site-nav" aria-label="Primary navigation"><a href="/#book">Book</a><a href="/calendar">Availability</a><a href="/#pet-taxi">Pet taxi</a><a aria-current="page" href="/chat">Chat</a></nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark theme" aria-pressed="false"><span class="theme-toggle__track" aria-hidden="true"><span class="theme-toggle__thumb"></span></span><span data-theme-label>Light</span></button>
    </div>
  </header>

  <main class="chat-page__main standalone-only">
    <section class="chat-page__intro"><h1>Hostel4Pets chat</h1></section>
  </main>

  <div id="chat-panel-shell" class="standalone-chat-shell is-expanded" data-chat-fixed-open>
    <div class="chat-modal">
      <header class="chat-header">
      <span class="chat-header__avatar" aria-hidden="true"><img src="/graphics/robin.png" alt=""></span>
      <span class="title">Chat</span>
      <div id="chat-controls">
        <button id="mute-btn" class="emoji-btn" type="button" aria-label="Mute notifications" title="Mute notifications">🔕</button>
        <button id="clear-btn" class="emoji-btn" type="button" aria-label="Clear chat" title="Clear chat">×</button>
        <button id="collapse-btn" class="emoji-btn" type="button" aria-label="Toggle chat window" title="Toggle chat window" hidden></button>
      </div>
    </header>
    <main class="chat-body">
      <div id="chatroom" aria-live="polite"></div>
      <div id="message" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message" data-placeholder="Type your message here"></div>
    </main>
    <footer class="chat-footer">
      <input type="text" id="nickname" placeholder="Enter your nickname" aria-label="Nickname" hidden>
      <button id="submit-button" hidden>Start chat</button>
      <button id="send-button">Send message</button>
      </footer>
    </div>
  </div>
  <footer class="site-footer">
    <img src="/graphics/h4p.png" alt="" aria-hidden="true">
    <div class="site-footer__content">
      <p><strong>Hostel4Pets</strong> · Their home away from home</p>
      <p>Copyright © Hostel4Pets 2019–<span data-current-year>2026</span>. Hostel4Pets is a trademark of Krilavej LTD, registered at Companies House under <a href="https://find-and-update.company-information.service.gov.uk/company/SC729900" target="_blank" rel="noopener noreferrer">SC729900</a>.</p>
      <p>Made by <a href="https://kittycrow.dev" target="_blank" rel="noopener noreferrer">Kitty Crow</a> · <a href="https://github.com/kitty-crow" target="_blank" rel="noopener noreferrer">GitHub portfolio</a></p>
    </div>
    <p class="site-footer__version">Website v1.0.0</p>
  </footer>
</body>

</html>
