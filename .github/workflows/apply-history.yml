name: Validate and apply rewritten history

on:
  push:
    branches: [history-fixing]
  pull_request:
    branches: [main]

permissions:
  contents: write
  statuses: write

concurrency:
  group: history-rewrite
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-history]')) ||
      (github.event_name == 'pull_request' && github.head_ref == 'history-fixing')
    runs-on: ubuntu-latest
    env:
      EXPECTED_FINAL_SHA: 5e142f51415616afc0f21e2a1c552aa68857afcb
      RELEASE_TAG: v1.0.0
      AUTHOR_NAME: Kitty Crow
      AUTHOR_EMAIL: 141717449+kitty-crow@users.noreply.github.com
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply final source and stylesheet changes
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .history-rewrite/release.part-* | base64 --decode | gzip --decompress > /tmp/release.patch
          cat .history-rewrite/styles.part-* | base64 --decode | gzip --decompress > /tmp/styles-milestone.patch
          git apply /tmp/release.patch

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Validate and compile release
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build
          rm -rf generated
          cp -a dist/generated generated
          diff -qr generated dist/generated
          test -f dist/styles/styles.css
          test -f dist/styles/calendar.css
          test -f dist/styles/chat.css
          test "$(cat VERSION)" = "1.0.0"

      - name: Verify the built site over HTTP
        working-directory: dist
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hostel4pets-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          for path in \
            / \
            /styles/styles.css \
            /styles/calendar.css \
            /styles/chat.css \
            /generated/bookingCalculator.js \
            /generated/calendar.js \
            /generated/main.js; do
            curl --fail --silent --show-error "http://127.0.0.1:4173${path}" >/dev/null
          done

      - name: Construct six-commit release history
        id: rewrite
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

          rm -rf /tmp/hostel4pets-css-stage
          git worktree add --detach /tmp/hostel4pets-css-stage d365395964fd1f46d4438de336a41e2516738cb6
          git -C /tmp/hostel4pets-css-stage apply /tmp/styles-milestone.patch
          git -C /tmp/hostel4pets-css-stage add -A
          css_tree=$(git -C /tmp/hostel4pets-css-stage write-tree)

          git add -A
          git rm -r --cached --ignore-unmatch \
            .history-rewrite \
            .github/workflows/apply-history.yml \
            .github/workflows/repository-bundle.yml >/dev/null 2>&1 || true
          final_tree=$(git write-tree)

          export GIT_AUTHOR_NAME="$AUTHOR_NAME"
          export GIT_AUTHOR_EMAIL="$AUTHOR_EMAIL"
          export GIT_COMMITTER_NAME="$AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$AUTHOR_EMAIL"

          commit_root() {
            local tree=$1 date=$2 message=$3
            GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git commit-tree "$tree" <<<"$message"
          }

          commit_child() {
            local tree=$1 parent=$2 date=$3 message=$4
            GIT_AUTHOR_DATE="$date" GIT_COMMITTER_DATE="$date" git commit-tree "$tree" -p "$parent" <<<"$message"
          }

          message_1=$'Create booking calculator website\n\nAdd the initial static booking form, price and deposit calculation, branding,\nresponsive base styles and custom domain configuration.'
          message_2=$'Add availability calendar and booking details\n\nAdd monthly availability, booking markers, selected date ranges and the daily\npet detail view.'
          message_3=$'Add guest chat and notification controls\n\nAdd the guest chat panel, message presentation, notification sound, mute and\nclear controls, typing feedback and staff hand-off notices. Organise image and\nsound assets under dedicated directories.'
          message_4=$'Add pet taxi and service integrations\n\nAdd pet taxi coverage and price requests, then consolidate calendar, chat and\ntaxi service calls on the Hostel4Pets API hosted at h4p.kittycrow.dev.'
          message_5=$'Modularise and modernise website styles\n\nMove styling into feature modules under styles/ and assemble them through a\nlayered styles.css entry point. Adopt native nesting, logical properties,\nresponsive range queries and reduced-motion handling without changing the\nsite public behaviour.'
          message_6=$'Migrate frontend to strict TypeScript and release v1.0.0\n\nReplace hand-written browser JavaScript with strict TypeScript source and\ntracked generated ES modules. Add source, stylesheet and release validation,\nrepair branch-based Pages deployment, verify published assets, remove inline\ncode and document the production build and project structure.'

          tree_1=$(git rev-parse b25e258^{tree})
          tree_2=$(git rev-parse 7fe5f69^{tree})
          tree_3=$(git rev-parse c82cbb0^{tree})
          tree_4=$(git rev-parse d365395^{tree})

          commit_1=$(commit_root "$tree_1" '2025-01-26T12:20:18Z' "$message_1")
          commit_2=$(commit_child "$tree_2" "$commit_1" '2025-09-27T20:46:29+01:00' "$message_2")
          commit_3=$(commit_child "$tree_3" "$commit_2" '2025-11-12T14:07:58Z' "$message_3")
          commit_4=$(commit_child "$tree_4" "$commit_3" '2026-05-21T15:09:36+01:00' "$message_4")
          commit_5=$(commit_child "$css_tree" "$commit_4" '2026-07-27T09:28:18+01:00' "$message_5")
          commit_6=$(commit_child "$final_tree" "$commit_5" '2026-07-27T09:42:00+01:00' "$message_6")

          test "$css_tree" = "001b3ed72585612af20e1db4cc8e2fae8cd8d8c2"
          test "$final_tree" = "234aa73a4653b0d113c8ee43ce9351f7734fbc92"
          test "$commit_6" = "$EXPECTED_FINAL_SHA"
          test "$(git rev-list --count "$commit_6")" = "6"

          git update-ref refs/heads/rewritten-main "$commit_6"
          GIT_COMMITTER_DATE='2026-07-27T09:42:00+01:00' \
            git tag -f -a "$RELEASE_TAG" "$commit_6" -m 'Hostel4Pets website v1.0.0'

          echo "final_sha=$commit_6" >> "$GITHUB_OUTPUT"

      - name: Publish validated rewrite branch and release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin refs/heads/rewritten-main:refs/heads/history-fixing
          git push --force origin "refs/tags/${RELEASE_TAG}"

      - name: Remove every non-main branch
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}')
          for branch in "${branches[@]}"; do
            if [[ "$branch" != "main" ]]; then
              git push origin --delete "$branch"
            fi
          done

      - name: Record completed rewrite validation
        uses: actions/github-script@v8
        env:
          FINAL_SHA: ${{ steps.rewrite.outputs.final_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.FINAL_SHA,
              state: 'success',
              context: 'history/rewrite-validation',
              description: 'Six-commit v1.0.0 history built and branches cleaned'
            });
